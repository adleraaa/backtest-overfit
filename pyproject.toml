[build-system]
requires = ["setuptools>=77"]  # PEP 639 string license
build-backend = "setuptools.build_meta"

[project]
name = "btoverfit"
version = "0.1.0"
description = "Backtest overfitting diagnostics (PBO, Deflated Sharpe, walk-forward) on Kenneth French industry data"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yunlong Lu" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD002", "SIM"]
